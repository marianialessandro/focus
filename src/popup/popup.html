<!DOCTYPE html>
<html lang="it" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DriftQuell</title>

  <script src="../shared/theme.js"></script>

  <link rel="stylesheet" href="../shared/theme.css">
  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>
  <main class="container">
    <header class="popup-header">
      <h1>DriftQuell</h1>

      <button id="settings-button" class="icon-button" type="button" aria-label="Apri impostazioni" title="Impostazioni">
        <!-- Settings icon from Lucide, licensed under ISC: https://lucide.dev/license. -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </header>

    <div class="status">
      <span id="status-indicator"></span>
      <span id="status-text">
        Caricamento...
      </span>
    </div>

    <button id="toggle-button" class="primary-button">
      Caricamento...
    </button>

    <p id="manual-lock-message" class="manual-lock-message" hidden>Il blocco manuale non è modificabile durante uno schedule attivo.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
